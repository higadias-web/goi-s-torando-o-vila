<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goiás Torando o Vila — Invasão na Serrinha</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { cursor: default; }
  #gl, #hud { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  #hud { pointer-events: none; }
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,0.5) 100%); }
  noscript { color: #8f8; font-family: monospace; position: absolute; top: 40%; width: 100%; text-align: center; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vignette"></div>
<div id="flash"></div>
<canvas id="hud"></canvas>
<noscript>Este jogo precisa de JavaScript e WebGL2.</noscript>
<script src="js/util.js"></script>
<script src="js/font.js"></script>
<script src="js/textures.js"></script>
<script src="js/renderer.js"></script>
<script src="js/world.js"></script>
<script src="js/models.js"></script>
<script src="js/audio.js"></script>
<script src="js/level.js"></script>
<script src="js/effects.js"></script>
<script src="js/enemies.js"></script>
<script src="js/player.js"></script>
<script src="js/hud.js"></script>
<script src="js/game.js"></script>
</body>
</html>
